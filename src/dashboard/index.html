<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>worklane — queue</title>
    <style>
      /* One file, zero external requests: no CDN, no web fonts, no framework.
         Dark by default because this is an ops console; light mode is honoured
         when the system asks for it. */
      :root {
        color-scheme: dark light;
        --bg: #0d1117;
        --panel: #151b23;
        --panel-2: #1c2530;
        --line: #263141;
        --ink: #e6edf3;
        --dim: #8b98a8;
        --accent: #4aa8ff;
        --ok: #3fb950;
        --warn: #d29922;
        --bad: #f85149;
        --run: #58a6ff;
        --idle: #6e7681;
        --radius: 8px;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --sans: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f4f6fa;
          --panel: #ffffff;
          --panel-2: #eef1f6;
          --line: #d4dae3;
          --ink: #16202b;
          --dim: #5b6775;
          --accent: #0b62c4;
          --ok: #1a7f37;
          --warn: #9a6700;
          --bad: #cf222e;
          --run: #0b62c4;
          --idle: #8b949e;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.45;
      }

      header {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        padding: 14px 20px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        position: sticky;
        top: 0;
        z-index: 5;
      }

      h1 {
        margin: 0;
        font-size: 16px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-weight: 600;
      }

      h1 span {
        color: var(--accent);
      }

      .spacer {
        flex: 1;
      }

      .pill {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--dim);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px 10px;
        white-space: nowrap;
      }

      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 6px;
        background: var(--idle);
        vertical-align: middle;
      }

      .dot.live {
        background: var(--ok);
      }

      .dot.down {
        background: var(--bad);
      }

      main {
        padding: 20px;
        display: grid;
        gap: 20px;
        max-width: 1200px;
        margin: 0 auto;
      }

      section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        overflow: hidden;
      }

      section > h2 {
        margin: 0;
        padding: 10px 14px;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--dim);
        border-bottom: 1px solid var(--line);
        background: var(--panel-2);
        display: flex;
        gap: 10px;
        align-items: baseline;
      }

      section > h2 em {
        font-style: normal;
        font-family: var(--mono);
        text-transform: none;
        letter-spacing: 0;
        font-size: 11px;
        color: var(--idle);
      }

      .body {
        padding: 14px;
      }

      .tiles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 10px;
      }

      .tile {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 10px 12px;
        background: var(--panel-2);
      }

      .tile .n {
        font-family: var(--mono);
        font-size: 26px;
        line-height: 1.1;
      }

      .tile .k {
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--dim);
      }

      .tile.pending .n {
        color: var(--accent);
      }
      .tile.running .n {
        color: var(--run);
      }
      .tile.succeeded .n {
        color: var(--ok);
      }
      .tile.failed .n {
        color: var(--warn);
      }
      .tile.deadLetter .n {
        color: var(--bad);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      th,
      td {
        text-align: left;
        padding: 7px 14px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }

      th {
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--dim);
        font-weight: 500;
      }

      tbody tr:last-child td {
        border-bottom: none;
      }

      td.num,
      th.num {
        text-align: right;
        font-family: var(--mono);
      }

      td.mono {
        font-family: var(--mono);
      }

      .empty {
        padding: 14px;
        color: var(--dim);
        font-style: italic;
      }

      .job {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 10px 12px;
        margin-bottom: 10px;
        background: var(--panel-2);
      }

      .job:last-child {
        margin-bottom: 0;
      }

      .job .top {
        display: flex;
        gap: 10px;
        align-items: baseline;
        flex-wrap: wrap;
      }

      .job .id {
        font-family: var(--mono);
        color: var(--accent);
      }

      .job .note {
        color: var(--dim);
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .bar {
        height: 8px;
        border-radius: 4px;
        background: var(--line);
        margin-top: 8px;
        overflow: hidden;
      }

      .bar > i {
        display: block;
        height: 100%;
        background: var(--run);
        transition: width 0.3s ease;
      }

      .bar.indeterminate > i {
        width: 100%;
        opacity: 0.35;
      }

      button {
        font: inherit;
        font-size: 12px;
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 3px 10px;
        cursor: pointer;
      }

      button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      button.danger:hover {
        border-color: var(--bad);
        color: var(--bad);
      }

      input[type="password"] {
        font: inherit;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 4px 8px;
        width: 190px;
      }

      #tokenbar {
        display: none;
        gap: 8px;
        align-items: center;
      }

      #tokenbar.show {
        display: flex;
      }

      .state {
        font-family: var(--mono);
        font-size: 11px;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 1px 6px;
      }

      .state.SUCCEEDED {
        color: var(--ok);
      }
      .state.FAILED {
        color: var(--warn);
      }
      .state.DEAD_LETTER,
      .state.CANCELLED {
        color: var(--bad);
      }
      .state.RUNNING,
      .state.CLAIMED {
        color: var(--run);
      }
      .state.PENDING {
        color: var(--accent);
      }

      #feed {
        margin: 0;
        padding: 0;
        list-style: none;
        max-height: 220px;
        overflow-y: auto;
        font-family: var(--mono);
        font-size: 12px;
      }

      #feed li {
        padding: 4px 14px;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 10px;
      }

      #feed li .t {
        color: var(--idle);
      }

      #feed li .k {
        min-width: 90px;
      }

      #err {
        display: none;
        margin: 0;
        padding: 8px 14px;
        background: var(--bad);
        color: #fff;
        font-family: var(--mono);
        font-size: 12px;
      }

      #err.show {
        display: block;
      }

      footer {
        padding: 0 20px 24px;
        color: var(--idle);
        font-size: 12px;
        max-width: 1200px;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>work<span>lane</span></h1>
      <span class="pill"><span id="conn" class="dot"></span><span id="connlabel">connecting</span></span>
      <span class="pill" id="uptime">uptime —</span>
      <span class="spacer"></span>
      <div id="tokenbar">
        <input id="token" type="password" placeholder="bearer token" autocomplete="off" />
        <button id="save" type="button">use token</button>
      </div>
      <button id="refresh" type="button">refresh</button>
    </header>

    <p id="err"></p>

    <main>
      <section>
        <h2>Queue depth <em id="depthnote"></em></h2>
        <div class="body"><div class="tiles" id="tiles"></div></div>
      </section>

      <section>
        <h2>Throughput by type <em id="window"></em></h2>
        <div id="bytype"></div>
      </section>

      <section>
        <h2>Running now <em id="runningnote"></em></h2>
        <div class="body" id="running"></div>
      </section>

      <section>
        <h2>Dead letter <em>requeue puts a job back as PENDING</em></h2>
        <div id="dlq"></div>
      </section>

      <section>
        <h2>Workers <em>lease table</em></h2>
        <div id="workers"></div>
      </section>

      <section>
        <h2>Event stream <em>/events</em></h2>
        <ul id="feed"></ul>
      </section>
    </main>

    <footer>
      worklane — one box, one SQLite file, N workers. At-least-once delivery.
    </footer>

    <script>
      "use strict";

      // ---- state -----------------------------------------------------------
      var POLL_MS = 2000;
      var FEED_MAX = 60;
      var STATES = [
        ["pending", "pending"],
        ["claimed", "claimed"],
        ["running", "running"],
        ["failed", "failed"],
        ["succeeded", "succeeded"],
        ["deadLetter", "dead letter"],
        ["cancelled", "cancelled"],
      ];

      var token = "";
      try {
        token = window.sessionStorage.getItem("worklane.token") || "";
      } catch (e) {
        token = "";
      }
      var streamAbort = null;
      var polling = null;

      // ---- tiny helpers ----------------------------------------------------
      function $(id) {
        return document.getElementById(id);
      }

      function el(tag, cls, text) {
        var node = document.createElement(tag);
        if (cls) node.className = cls;
        if (text !== undefined && text !== null) node.textContent = String(text);
        return node;
      }

      function headers() {
        var h = { accept: "application/json" };
        if (token) h.authorization = "Bearer " + token;
        return h;
      }

      function showError(message) {
        var box = $("err");
        if (!message) {
          box.className = "";
          box.textContent = "";
          return;
        }
        box.className = "show";
        box.textContent = message;
      }

      function needToken(on) {
        $("tokenbar").className = on ? "show" : "";
      }

      function conn(status, label) {
        $("conn").className = "dot " + status;
        $("connlabel").textContent = label;
      }

      function ago(ts, now) {
        if (ts === null || ts === undefined) return "—";
        var s = Math.max(0, Math.round((now - ts) / 1000));
        if (s < 60) return s + "s ago";
        if (s < 3600) return Math.round(s / 60) + "m ago";
        return Math.round(s / 3600) + "h ago";
      }

      function duration(ms) {
        if (ms === null || ms === undefined) return "—";
        if (ms < 1000) return Math.round(ms) + "ms";
        return (ms / 1000).toFixed(1) + "s";
      }

      function clock(ms) {
        var s = Math.floor(ms / 1000);
        var h = Math.floor(s / 3600);
        var m = Math.floor((s % 3600) / 60);
        return h > 0 ? h + "h " + m + "m" : m + "m " + (s % 60) + "s";
      }

      function hhmmss(ts) {
        var d = new Date(ts);
        function pad(n) {
          return n < 10 ? "0" + n : String(n);
        }
        return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
      }

      // ---- transport -------------------------------------------------------
      async function api(path, options) {
        var opts = options || {};
        opts.headers = headers();
        opts.cache = "no-store";
        var response = await fetch(path, opts);
        if (response.status === 401) {
          needToken(true);
          throw new Error("401 — this worklane wants a bearer token");
        }
        if (!response.ok) throw new Error(path + " answered " + response.status);
        return response.json();
      }

      // ---- rendering -------------------------------------------------------
      function renderTiles(stats) {
        var host = $("tiles");
        host.textContent = "";
        var total = 0;
        for (var i = 0; i < STATES.length; i += 1) {
          var key = STATES[i][0];
          var count = stats[key] || 0;
          total += count;
          var tile = el("div", "tile " + key);
          tile.appendChild(el("div", "n", count));
          tile.appendChild(el("div", "k", STATES[i][1]));
          host.appendChild(tile);
        }
        $("depthnote").textContent = total + " jobs on file";
      }

      function renderByType(rows) {
        var host = $("bytype");
        host.textContent = "";
        if (!rows.length) {
          host.appendChild(el("div", "empty", "no jobs yet"));
          return;
        }
        var cols = [
          ["type", "type"],
          ["pending", "pending"],
          ["running", "running"],
          ["succeeded", "succeeded"],
          ["failed", "failed"],
          ["deadLetter", "dead"],
          ["cancelled", "cancelled"],
          ["succeededRecently", "in window"],
          ["avgDurationMs", "avg"],
        ];
        var table = el("table");
        var head = el("tr");
        for (var c = 0; c < cols.length; c += 1) {
          head.appendChild(el("th", c === 0 ? "" : "num", cols[c][1]));
        }
        table.appendChild(el("thead")).appendChild(head);
        var body = el("tbody");
        for (var r = 0; r < rows.length; r += 1) {
          var row = rows[r];
          var tr = el("tr");
          tr.appendChild(el("td", "mono", row.type));
          for (var k = 1; k < cols.length; k += 1) {
            var field = cols[k][0];
            var value = field === "avgDurationMs" ? duration(row[field]) : row[field];
            tr.appendChild(el("td", "num", value));
          }
          body.appendChild(tr);
        }
        table.appendChild(body);
        host.appendChild(table);
      }

      function renderRunning(jobs) {
        var host = $("running");
        host.textContent = "";
        $("runningnote").textContent = jobs.length + " in flight";
        if (!jobs.length) {
          host.appendChild(el("div", "empty", "nothing running"));
          return;
        }
        for (var i = 0; i < jobs.length; i += 1) {
          host.appendChild(runningCard(jobs[i]));
        }
      }

      function runningCard(job) {
        var card = el("div", "job");
        var top = el("div", "top");
        top.appendChild(el("span", "id", "#" + job.id));
        top.appendChild(el("span", "mono", job.type));
        top.appendChild(el("span", "state " + job.state, job.state));
        top.appendChild(el("span", "note", "worker " + (job.workerId || "—")));
        top.appendChild(el("span", "spacer"));

        var known = job.progressTotal !== null && job.progressTotal > 0;
        var done = job.progressDone || 0;
        var pct = known ? Math.min(100, Math.round((done / job.progressTotal) * 100)) : 0;
        top.appendChild(el("span", "note", known ? done + "/" + job.progressTotal + " · " + pct + "%" : "no progress reported"));

        var cancel = el("button", "danger", "cancel");
        cancel.type = "button";
        cancel.addEventListener("click", function () {
          cancel.disabled = true;
          api("/jobs/" + job.id + "/cancel", { method: "POST" }).then(refresh, function (e) {
            cancel.disabled = false;
            showError(e.message);
          });
        });
        top.appendChild(cancel);
        card.appendChild(top);

        if (job.progressNote) card.appendChild(el("div", "note", job.progressNote));

        var bar = el("div", known ? "bar" : "bar indeterminate");
        var fill = el("i");
        fill.style.width = known ? pct + "%" : "100%";
        bar.appendChild(fill);
        card.appendChild(bar);
        return card;
      }

      function renderDlq(jobs) {
        var host = $("dlq");
        host.textContent = "";
        if (!jobs.length) {
          host.appendChild(el("div", "empty", "dead-letter queue is empty"));
          return;
        }
        var table = el("table");
        var head = el("tr");
        ["id", "type", "attempts", "last error", ""].forEach(function (label, index) {
          head.appendChild(el("th", index === 2 ? "num" : "", label));
        });
        table.appendChild(el("thead")).appendChild(head);
        var body = el("tbody");
        for (var i = 0; i < jobs.length; i += 1) {
          body.appendChild(dlqRow(jobs[i]));
        }
        table.appendChild(body);
        host.appendChild(table);
      }

      function dlqRow(job) {
        var tr = el("tr");
        tr.appendChild(el("td", "mono", "#" + job.id));
        tr.appendChild(el("td", "mono", job.type));
        tr.appendChild(el("td", "num", job.attempts + "/" + job.maxAttempts));
        var err = el("td", "note", job.lastError || "—");
        err.style.whiteSpace = "normal";
        tr.appendChild(err);
        var cell = el("td");
        var button = el("button", "", "requeue");
        button.type = "button";
        button.addEventListener("click", function () {
          button.disabled = true;
          api("/jobs/" + job.id + "/requeue", { method: "POST" }).then(refresh, function (e) {
            button.disabled = false;
            showError(e.message);
          });
        });
        cell.appendChild(button);
        tr.appendChild(cell);
        return tr;
      }

      function renderWorkers(workers, now) {
        var host = $("workers");
        host.textContent = "";
        if (!workers.length) {
          host.appendChild(el("div", "empty", "no workers registered"));
          return;
        }
        var table = el("table");
        var head = el("tr");
        ["worker", "started", "last heartbeat", "holding"].forEach(function (label) {
          head.appendChild(el("th", "", label));
        });
        table.appendChild(el("thead")).appendChild(head);
        var body = el("tbody");
        for (var i = 0; i < workers.length; i += 1) {
          var w = workers[i];
          var tr = el("tr");
          tr.appendChild(el("td", "mono", w.id));
          tr.appendChild(el("td", "", ago(w.startedAt, now)));
          tr.appendChild(el("td", "", ago(w.lastHeartbeat, now)));
          tr.appendChild(
            el("td", "mono", w.claimedJobId === null ? "idle" : "#" + w.claimedJobId),
          );
          body.appendChild(tr);
        }
        table.appendChild(body);
        host.appendChild(table);
      }

      function pushEvent(event) {
        var feed = $("feed");
        var li = el("li");
        li.appendChild(el("span", "t", hhmmss(event.ts)));
        li.appendChild(el("span", "k", event.kind));
        li.appendChild(el("span", "", "#" + event.jobId + " " + event.type));
        if (event.error) li.appendChild(el("span", "t", event.error.slice(0, 60)));
        feed.insertBefore(li, feed.firstChild);
        while (feed.childNodes.length > FEED_MAX) feed.removeChild(feed.lastChild);
      }

      // ---- polling ---------------------------------------------------------
      async function refresh() {
        try {
          var stats = await api("/stats");
          var dead = await api("/jobs?state=DEAD_LETTER&limit=50");
          var health = await fetch("/healthz", { cache: "no-store" }).then(function (r) {
            return r.ok ? r.json() : null;
          });

          showError("");
          needToken(false);
          renderTiles(stats.stats);
          renderByType(stats.byType);
          renderRunning(stats.running);
          renderDlq(dead.jobs);
          renderWorkers(stats.workers, stats.now);
          $("window").textContent =
            "succeeded in the last " + Math.round(stats.throughputWindowMs / 1000) + "s";
          if (health) $("uptime").textContent = "uptime " + clock(health.uptimeMs);
          conn("live", "live");
        } catch (e) {
          conn("down", "error");
          showError(e.message);
        }
      }

      // ---- the SSE stream (fetch, not EventSource: it needs a header) -------
      async function stream() {
        if (streamAbort) streamAbort.abort();
        var controller = new AbortController();
        streamAbort = controller;
        var request = { headers: { accept: "text/event-stream" }, signal: controller.signal };
        if (token) request.headers.authorization = "Bearer " + token;

        try {
          var response = await fetch("/events?replay=15", request);
          if (!response.ok || !response.body) {
            if (response.status === 401) needToken(true);
            throw new Error("/events answered " + response.status);
          }
          conn("live", "live");
          var reader = response.body.getReader();
          var decoder = new TextDecoder();
          var buffer = "";
          for (;;) {
            var chunk = await reader.read();
            if (chunk.done) break;
            buffer += decoder.decode(chunk.value, { stream: true });
            var boundary = buffer.indexOf("\n\n");
            while (boundary !== -1) {
              handleBlock(buffer.slice(0, boundary));
              buffer = buffer.slice(boundary + 2);
              boundary = buffer.indexOf("\n\n");
            }
          }
        } catch (e) {
          if (controller.signal.aborted) return;
          conn("down", "stream lost");
        }
        // The stream ended: wait a beat and pick it back up.
        if (!controller.signal.aborted) window.setTimeout(stream, 2000);
      }

      function handleBlock(block) {
        var lines = block.split("\n");
        var payload = "";
        for (var i = 0; i < lines.length; i += 1) {
          if (lines[i].charAt(0) === ":") continue;
          if (lines[i].indexOf("data:") === 0) payload += lines[i].slice(5).trim();
        }
        if (!payload) return;
        try {
          var event = JSON.parse(payload);
        } catch (e) {
          return;
        }
        pushEvent(event);
        // Progress arrives constantly; everything else changes a table.
        if (event.kind !== "progress") refresh();
      }

      // ---- wiring ----------------------------------------------------------
      $("refresh").addEventListener("click", function () {
        refresh();
      });

      $("save").addEventListener("click", function () {
        token = $("token").value.trim();
        try {
          window.sessionStorage.setItem("worklane.token", token);
        } catch (e) {
          /* private mode: keep it in memory only */
        }
        needToken(false);
        refresh();
        stream();
      });

      $("token").addEventListener("keydown", function (event) {
        if (event.key === "Enter") $("save").click();
      });

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
          if (polling) window.clearInterval(polling);
          polling = null;
        } else if (!polling) {
          polling = window.setInterval(refresh, POLL_MS);
          refresh();
        }
      });

      refresh();
      stream();
      polling = window.setInterval(refresh, POLL_MS);
    </script>
